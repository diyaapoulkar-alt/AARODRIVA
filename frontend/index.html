<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f0ff'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AARODRIVA AI — Emergency Operations Centre</title>
    <!-- Leaflet CSS & JS via CDN for rock-solid reliability -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Tailwind CDN for instant zero-config styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              tactical: {
                900: '#070b14',
                800: '#0f172a',
                700: '#1e293b',
                card: '#111c33',
                cyan: '#00f0ff',
                green: '#10b981',
                red: '#ef4444',
                amber: '#f59e0b'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #070b14;
        color: #f1f5f9;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom glowing animations */
      @keyframes pulse-glow {
        0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.8)); }
        50% { opacity: 0.6; transform: scale(1.15); filter: drop-shadow(0 0 12px rgba(239, 68, 68, 1)); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s infinite ease-in-out;
      }
      /* Leaflet dark styling */
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: #0f172a !important;
        color: #f8fafc !important;
        border: 1px solid #334155 !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7) !important;
      }
    </style>
  </head>
  <body class="bg-tactical-900 text-slate-100 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
